    <style>

        /* =====================================================
           SAFE VALORA FALLBACKS
           لا تؤثر على ملفات المشروع الأصلية
        ====================================================== */

        :root {

            --users-gold: #d4af37;
            --users-gold-light: #e6c75a;
            --users-gold-soft: rgba(212, 175, 55, 0.10);

            --users-bg: #080808;
            --users-surface: #111111;
            --users-surface-2: #161616;
            --users-surface-3: #1b1b1b;

            --users-border: rgba(255, 255, 255, 0.08);

            --users-text: #f3f3f3;
            --users-text-soft: #c4c4c4;
            --users-text-muted: #858585;

            --users-success: #55c98a;
            --users-warning: #e5b85c;
            --users-danger: #e66b6b;

            --users-radius: 12px;
            --users-radius-small: 8px;

            --users-transition: 0.2s ease;
        }


        /* =====================================================
           PAGE
        ====================================================== */

        .users-page {
            width: 100%;
            max-width: 100%;
        }


        /* =====================================================
           MOBILE MENU BUTTON
           التعديل المطلوب فقط على الثلاث شخطات
        ====================================================== */

        .admin-mobile-menu {

            width: 42px;
            height: 42px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 0;

            border: 1px solid var(--users-border) !important;
            border-radius: 9px;

            background: transparent !important;

            color: var(--users-gold-light) !important;

            font-family: Arial, sans-serif;
            font-size: 21px;
            font-weight: 700;

            line-height: 1;

            cursor: pointer;

            transition:
                background var(--users-transition),
                border-color var(--users-transition),
                color var(--users-transition),
                transform var(--users-transition);
        }


        .admin-mobile-menu:hover {

            background:
                var(--users-gold-soft) !important;

            border-color:
                rgba(212, 175, 55, 0.35) !important;

            color:
                var(--users-gold-light) !important;
        }


        .admin-mobile-menu:active {

            transform: scale(0.96);
        }


        .admin-mobile-menu:focus {

            outline: none;

            border-color:
                rgba(212, 175, 55, 0.45) !important;
        }


        /* =====================================================
           PAGE TOP
        ====================================================== */

        .users-page-header {

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            margin-bottom: 20px;
        }


        .users-page-title h1 {

            margin: 0;

            color: var(--users-text);

            font-size: 25px;
            font-weight: 800;
        }


        .users-page-title p {

            margin: 6px 0 0;

            color: var(--users-text-muted);

            font-size: 12px;

            line-height: 1.8;
        }


        /* =====================================================
           HEADER ACTIONS
        ====================================================== */

        .users-header-actions {

            display: flex;
            align-items: center;

            gap: 8px;
        }
