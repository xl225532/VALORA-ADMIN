    <meta

    <!-- =====================================================

    <link

    <style>

        /* =================================================
           USERS PAGE
        ================================================= */

        .users-page {
            width: 100%;
        }


        /* =================================================
           PAGE HEADER
        ================================================= */

        .users-page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }

        .users-page-title h1 {
            margin: 0;
            color: var(--va-text);
            font-size: 25px;
            font-weight: 800;
        }

        .users-page-title p {
            margin: 6px 0 0;
            color: var(--va-text-muted);
            font-size: 12px;
        }


        /* =================================================
           HEADER ACTIONS
        ================================================= */

        .users-header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .users-action-button {
            min-height: 42px;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            padding: 0 15px;

            border: 1px solid var(--va-border);
            border-radius: var(--va-radius-sm);

            background: var(--va-surface);
            color: var(--va-text-soft);

            font-size: 12px;
            font-weight: 700;

            transition:
                background var(--va-transition),
                border-color var(--va-transition),
                color var(--va-transition),
                transform var(--va-transition);
        }

        .users-action-button:hover {
            background: var(--va-surface-2);
            border-color: rgba(212, 175, 55, 0.25);
            color: var(--va-gold-light);
        }

        .users-action-button.primary {
            background: var(--va-gold);
            border-color: var(--va-gold);
            color: #080808;
        }

        .users-action-button.primary:hover {
            background: var(--va-gold-light);
            color: #080808;
        }


        /* =================================================
           MOBILE SIDEBAR MENU BUTTON
           VALORA GOLD THEME
        ================================================= */

        .admin-mobile-menu {
            color: var(--va-gold-light) !important;

            background: transparent !important;

            border: 1px solid var(--va-border) !important;

            border-radius: 8px;

            transition:
                color var(--va-transition),
                background var(--va-transition),
                border-color var(--va-transition);
        }

        .admin-mobile-menu:hover,
        .admin-mobile-menu:focus,
        .admin-mobile-menu:active {
            color: var(--va-gold-light) !important;

            background:
                var(--va-gold-soft) !important;

            border-color:
                rgba(212, 175, 55, 0.30) !important;

            outline: none;
        }


        /* =================================================
           FILTER PANEL
        ================================================= */

        .users-filter-panel {
            width: 100%;
            margin-bottom: 16px;
            padding: 18px;

            border:
                1px solid
                var(--va-border);

            border-radius:
                var(--va-radius-md);

            background:
                var(--va-surface);
        }

        .users-filter-grid {
            display: grid;

            grid-template-columns:
                minmax(250px, 2fr)
                repeat(3, minmax(150px, 1fr))
                auto;

            gap: 10px;
            align-items: end;
        }


        /* =================================================
           INPUTS
        ================================================= */

        .users-field {
            min-width: 0;
        }

        .users-field label {
            display: block;

            margin-bottom: 6px;

            color:
                var(--va-text-muted);

            font-size: 10px;
            font-weight: 600;
        }

        .users-input,
        .users-select {
            width: 100%;
            height: 42px;

            padding: 0 12px;

            border:
                1px solid
                var(--va-border);

            border-radius:
                var(--va-radius-sm);

            outline: none;

            background:
                var(--va-surface-2);

            color:
                var(--va-text);

            font-family: inherit;
            font-size: 11px;

            transition:
                border-color var(--va-transition),
                background var(--va-transition);
        }

        .users-input::placeholder {
            color: #666;
        }

        .users-input:focus,
        .users-select:focus {
            border-color:
                rgba(212, 175, 55, 0.45);

            background:
                var(--va-surface-3);
        }


        /* =================================================
           FILTER BUTTON
        ================================================= */

        .users-filter-button {
            height: 42px;

            padding: 0 16px;

            border:
                1px solid
                rgba(212, 175, 55, 0.25);

            border-radius:
                var(--va-radius-sm);

            background:
                var(--va-gold-soft);

            color:
                var(--va-gold-light);

            font-family: inherit;
            font-size: 11px;
            font-weight: 700;

            cursor: pointer;
        }


        /* =================================================
           TABLE PANEL
        ================================================= */

        .users-table-panel {
            width: 100%;
            overflow: hidden;

            border:
                1px solid
                var(--va-border);

            border-radius:
                var(--va-radius-md);

            background:
                var(--va-surface);
        }


        /* =================================================
           TABLE HEADER
        ================================================= */

        .users-table-header {
            min-height: 64px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            padding: 14px 18px;

            border-bottom:
                1px solid
                var(--va-border);
        }

        .users-table-header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .users-table-header-title strong {
            color:
                var(--va-text);

            font-size: 13px;
            font-weight: 800;
        }

        .users-count {
            min-width: 25px;
            height: 23px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 0 7px;

            border-radius: 999px;

            background:
                var(--va-gold-soft);

            color:
                var(--va-gold-light);

            font-size: 10px;
            font-weight: 800;
        }


        /* =================================================
           TABLE SCROLL
        ================================================= */

        .users-table-scroll {
            width: 100%;

            overflow-x: auto;
            overflow-y: hidden;

            -webkit-overflow-scrolling: touch;
        }

        .users-table-scroll::-webkit-scrollbar {
            height: 7px;
        }

        .users-table-scroll::-webkit-scrollbar-track {
            background:
                var(--va-surface);
        }

        .users-table-scroll::-webkit-scrollbar-thumb {
            background:
                rgba(255, 255, 255, .12);

            border-radius: 999px;
        }


        /* =================================================
           USERS TABLE
        ================================================= */

        .users-table {
            width: 100%;
            min-width: 1250px;

            border-collapse: collapse;
        }

            height: 48px;

            padding: 0 12px;

            background:
                var(--va-surface
