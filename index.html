<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VALORA ADMIN - تسجيل الدخول</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #d4af37;
            --gold-light: #f1d77a;
            --gold-dark: #9c7614;
            --black: #050505;
            --black-light: #0d0d0d;
            --card: #111111;
            --border: rgba(212, 175, 55, 0.25);
            --text: #ffffff;
            --muted: #999999;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Tahoma, sans-serif;
            background:
                radial-gradient(circle at 50% 20%, rgba(212, 175, 55, 0.10), transparent 35%),
                linear-gradient(135deg, #000000 0%, #080808 50%, #111111 100%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* زخرفة خلفية */
        body::before {
            content: "";
            position: fixed;
            width: 420px;
            height: 420px;
            border: 1px solid rgba(212, 175, 55, 0.08);
            border-radius: 50%;
            top: -180px;
            right: -160px;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            border: 1px solid rgba(212, 175, 55, 0.06);
            border-radius: 50%;
            bottom: -250px;
            left: -220px;
            pointer-events: none;
        }

        .login-wrapper {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 2;
        }

        .login-card {
            background: rgba(17, 17, 17, 0.96);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 42px 36px;
            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.75),
                0 0 45px rgba(212, 175, 55, 0.06);
            backdrop-filter: blur(15px);
        }

        /* الشعار */
        .brand {
            text-align: center;
            margin-bottom: 34px;
        }

        .brand-logo {
            width: 78px;
            height: 78px;
            margin: 0 auto 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--gold);
            background:
                radial-gradient(circle, rgba(212, 175, 55, 0.18), transparent 65%),
                #090909;
            box-shadow:
                0 0 25px rgba(212, 175, 55, 0.18),
                inset 0 0 20px rgba(212, 175, 55, 0.08);
        }

        .brand-logo span {
            color: var(--gold);
            font-size: 27px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .brand h1 {
            color: var(--gold);
            font-size: 29px;
            letter-spacing: 3px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .brand p {
            color: var(--muted);
            font-size: 14px;
        }

        .admin-badge {
            display: inline-block;
            margin-top: 12px;
            padding: 5px 13px;
            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 20px;
            color: var(--gold-light);
            font-size: 11px;
            letter-spacing: 1px;
        }

        /* النموذج */
        .form-group {
            margin-bottom: 21px;
        }

        .form-group label {
            display: block;
            color: #dddddd;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 9px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold);
            font-size: 17px;
            pointer-events: none;
        }

        .form-control {
            width: 100%;
            height: 54px;
            border: 1px solid #292929;
            border-radius: 12px;
            background: #090909;
            color: #ffffff;
            padding: 0 47px 0 16px;
            outline: none;
            font-size: 14px;
            transition: 0.25s ease;
        }

        .form-control::placeholder {
            color: #666666;
        }

        .form-control:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.08);
            background: #0c0c0c;
        }

        .password-toggle {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: 0;
            color: #777777;
            cursor: pointer;
            font-size: 17px;
            padding: 4px;
        }

        .password-toggle:hover {
            color: var(--gold);
        }

        /* نسيت كلمة المرور */
        .forgot-row {
            display: flex;
            justify-content: flex-start;
            margin-top: -6px;
            margin-bottom: 24px;
        }

        .forgot-link {
            color: var(--gold);
            text-decoration: none;
            font-size: 13px;
            transition: 0.2s ease;
        }

        .forgot-link:hover {
            color: var(--gold-light);
            text-decoration: underline;
        }

        /* زر الدخول */
        .login-button {
            width: 100%;
            height: 55px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(
                135deg,
                var(--gold-dark),
                var(--gold),
                var(--gold-light)
            );
            color: #090909;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.25s ease;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.15);
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(212, 175, 55, 0.25);
        }

        .login-button:active {
            transform: translateY(0);
        }

        /* رسالة الخطأ */
        .message {
            display: none;
            margin-top: 17px;
            padding: 12px 14px;
            border-radius: 10px;
            text-align: center;
            font-size: 13px;
        }

        .message.error {
            display: block;
            color: #ff8f8f;
            background: rgba(255, 60, 60, 0.08);
            border: 1px solid rgba(255, 60, 60, 0.20);
        }

        /* أسفل الصفحة */
        .footer {
            text-align: center;
            margin-top: 27px;
            padding-top: 22px;
            border-top: 1px solid #222222;
            color: #666666;
            font-size: 11px;
        }

        .footer strong {
            color: #888888;
        }

        /* الموبايل */
        @media (max-width: 480px) {
            body {
                padding: 14px;
            }

            .login-card {
                padding: 34px 22px;
                border-radius: 20px;
            }

            .brand h1 {
                font-size: 25px;
            }

            .brand-logo {
                width: 70px;
                height: 70px;
            }

            .form-control {
                height: 52px;
            }

            .login-button {
                height: 53px;
            }
        }
    </style>
</head>

<body>

    <main class="login-wrapper">

        <section class="login-card">

            <div class="brand">

                <div class="brand-logo">
                    <span>V</span>
                </div>

                <h1>VALORA</h1>

                <p>لوحة الإدارة</p>

                <span class="admin-badge">
                    ADMIN PANEL
                </span>

            </div>

            <form id="loginForm" autocomplete="on">

                <!-- البريد الإلكتروني -->
                <div class="form-group">

                    <label for="email">
                        البريد الإلكتروني
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">✉</span>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-control"
                            placeholder="أدخل البريد الإلكتروني"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>

                <!-- كلمة المرور -->
                <div class="form-group">

                    <label for="password">
                        كلمة المرور
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">🔒</span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="أدخل كلمة المرور"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="إظهار كلمة المرور"
                        >
                            ◉
                        </button>

                    </div>

                </div>

                <!-- نسيت كلمة المرور -->
                <div class="forgot-row">

                    <a
                        href="forgot-password.html"
                        class="forgot-link"
                    >
                        نسيت كلمة المرور؟
                    </a>

                </div>

                <!-- تسجيل الدخول -->
                <button
                    type="submit"
                    class="login-button"
                >
                    تسجيل الدخول
                </button>

                <div
                    id="loginMessage"
                    class="message"
                ></div>

            </form>

            <div class="footer">
                VALORA ADMIN PANEL
                <br>
                <span>نظام إدارة آمن</span>
            </div>

        </section>

    </main>

    <script>
        <script src="js/admin.js"></script>
    </script>

</body>
</html>
