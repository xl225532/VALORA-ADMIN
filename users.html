<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VALORA ADMIN - المستخدمون</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #d4af37;
            --gold-light: #f0d878;
            --gold-dark: #9c7614;

            --black: #050505;
            --bg: #090909;
            --card: #111111;
            --card-2: #151515;

            --border: rgba(212, 175, 55, 0.18);

            --text: #ffffff;
            --muted: #8d8d8d;

            --green: #43d17b;
            --red: #ff5f5f;
            --blue: #55aaff;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Tahoma, sans-serif;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: 255px;
            height: 100vh;

            background:
                linear-gradient(
                    180deg,
                    #0b0b0b 0%,
                    #050505 100%
                );

            border-left: 1px solid var(--border);

            padding: 25px 15px;

            z-index: 1000;

            overflow-y: auto;
        }

        .logo {
            text-align: center;
            padding-bottom: 25px;
            margin-bottom: 15px;
            border-bottom: 1px solid #222;
        }

        .logo-circle {
            width: 58px;
            height: 58px;

            margin: 0 auto 10px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 2px solid var(--gold);

            color: var(--gold);

            font-size: 23px;
            font-weight: bold;

            box-shadow:
                0 0 22px rgba(212, 175, 55, 0.15);
        }

        .logo h2 {
            color: var(--gold);
            font-size: 20px;
            letter-spacing: 2px;
        }

        .logo span {
            color: #777;
            font-size: 11px;
        }

        .menu-title {
            color: #666;
            font-size: 11px;
            margin: 20px 12px 9px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;

            width: 100%;

            padding: 13px 14px;

            margin-bottom: 5px;

            border-radius: 10px;

            color: #b5b5b5;
            text-decoration: none;

            font-size: 14px;

            transition: 0.2s ease;
        }

        .menu-item:hover {
            background: rgba(212, 175, 55, 0.08);
            color: var(--gold-light);
        }

        .menu-item.active {
            background:
                linear-gradient(
                    90deg,
                    rgba(212, 175, 55, 0.16),
                    rgba(212, 175, 55, 0.04)
                );

            color: var(--gold);

            border-right: 3px solid var(--gold);
        }

        .menu-icon {
            width: 24px;
            text-align: center;
            font-size: 17px;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            margin-right: 255px;
            min-height: 100vh;
        }

        /* =========================
           TOP BAR
        ========================= */

        .topbar {
            height: 75px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;

            background: #0b0b0b;

            border-bottom: 1px solid #1c1c1c;

            position: sticky;
            top: 0;

            z-index: 500;
        }

        .page-title h1 {
            font-size: 21px;
            margin-bottom: 4px;
        }

        .page-title p {
            color: var(--muted);
            font-size: 12px;
        }

        .admin-profile {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .admin-avatar {
            width: 39px;
            height: 39px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #111;
            background: var(--gold);

            font-weight: bold;
        }

        .admin-info strong {
            display: block;
            font-size: 12px;
        }

        .admin-info span {
            color: #777;
            font-size: 10px;
        }

        /* =========================
           CONTENT
        ========================= */

        .content {
            padding: 30px;
        }

        /* =========================
           STATISTICS
        ========================= */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 16px;

            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--card);

            border: 1px solid #202020;

            border-radius: 15px;

            padding: 20px;

            position: relative;

            overflow: hidden;
        }

        .stat-card::after {
            content: "";

            position: absolute;

            width: 80px;
            height: 80px;

            left: -25px;
            bottom: -35px;

            border-radius: 50%;

            border: 1px solid rgba(212, 175, 55, 0.12);
        }

        .stat-icon {
            width: 38px;
            height: 38px;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(212, 175, 55, 0.09);

            color: var(--gold);

            margin-bottom: 15px;
        }

        .stat-card h3 {
            font-size: 23px;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: var(--muted);
            font-size: 12px;
        }

        /* =========================
           TOOLBAR
        ========================= */

        .users-card {
            background: var(--card);

            border: 1px solid #202020;

            border-radius: 17px;

            overflow: hidden;
        }

        .toolbar {
            padding: 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            border-bottom: 1px solid #202020;
        }

        .toolbar h2 {
            font-size: 17px;
        }

        .toolbar-left {
            display: flex;
            align-items: center;

            gap: 10px;

            flex: 1;
            justify-content: flex-end;
        }

        .search-box {
            position: relative;

            width: 270px;
        }

        .search-box input {
            width: 100%;
            height: 43px;

            background: #090909;

            border: 1px solid #292929;

            border-radius: 10px;

            outline: none;

            color: #fff;

            padding:
                0 42px
                0 12px;

            font-size: 13px;
        }

        .search-box input:focus {
            border-color: var(--gold);
        }

        .search-icon {
            position: absolute;

            right: 14px;
            top: 50%;

            transform: translateY(-50%);

            color: var(--gold);
        }

        .filter-select {
            height: 43px;

            background: #090909;

            color: #ccc;

            border: 1px solid #292929;

            border-radius: 10px;

            padding: 0 12px;

            outline: none;

            min-width: 135px;
        }

        .filter-select:focus {
            border-color: var(--gold);
        }

        /* =========================
           TABLE
        ========================= */

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;

            min-width: 900px;
        }

        thead {
            background: #0d0d0d;
        }

        th {
            color: #777;

            font-size: 11px;

            font-weight: normal;

            padding: 15px 17px;

            text-align: right;

            white-space: nowrap;
        }

        td {
            padding: 16px 17px;

            border-top: 1px solid #1e1e1e;

            font-size: 12px;

            white-space: nowrap;
        }

        tbody tr {
            transition: 0.2s ease;
        }

        tbody tr:hover {
            background: rgba(212, 175, 55, 0.035);
        }

        .user-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 36px;
            height: 36px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                rgba(212, 175, 55, 0.11);

            color: var(--gold);

            border: 1px solid rgba(212, 175, 55, 0.2);

            font-weight: bold;
        }

        .user-name strong {
            display: block;
            color: #eee;
            margin-bottom: 3px;
        }

        .user-name span {
            color: #666;
            font-size: 10px;
        }

        .email {
            color: #aaa;
        }

        .balance {
            color: var(--gold-light);
            font-weight: bold;
        }

        .status {
            display: inline-flex;

            align-items: center;

            gap: 5px;

            padding: 5px 9px;

            border-radius: 20px;

            font-size: 10px;
        }

        .status::before {
            content: "";

            width: 5px;
            height: 5px;

            border-radius: 50%;
        }

        .status.active {
            color: var(--green);
            background: rgba(67, 209, 123, 0.08);
        }

        .status.active::before {
            background: var(--green);
        }

        .status.blocked {
            color: var(--red);
            background: rgba(255, 95, 95, 0.08);
        }

        .status.blocked::before {
            background: var(--red);
        }

        .view-btn {
            border: 1px solid rgba(212, 175, 55, 0.25);

            background: rgba(212, 175, 55, 0.06);

            color: var(--gold);

            padding: 7px 11px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 11px;

            transition: 0.2s;
        }

        .view-btn:hover {
            background: rgba(212, 175, 55, 0.14);
        }

        /* =========================
           PAGINATION
        ========================= */

        .pagination {
            padding: 18px 20px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            border-top: 1px solid #202020;
        }

        .pagination-info {
            color: #666;
            font-size: 11px;
        }

        .pages {
            display: flex;
            gap: 5px;
        }

        .page {
            width: 32px;
            height: 32px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 7px;

            background: #0a0a0a;

            border: 1px solid #252525;

            color: #888;

            cursor: pointer;
        }

        .page.active {
            color: #111;
            background: var(--gold);
            border-color: var(--gold);
        }

        /* =========================
           MOBILE MENU
        ========================= */

        .mobile-menu {
            display: none;

            width: 42px;
            height: 42px;

            border-radius: 9px;

            border: 1px solid #292929;

            background: #111;

            color: var(--gold);

            font-size: 20px;

            cursor: pointer;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 1000px) {

            .stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }
        }

        @media (max-width: 750px) {

            .sidebar {
                transform: translateX(100%);
                transition: 0.3s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main {
                margin-right: 0;
            }

            .mobile-menu {
                display: block;
            }

            .topbar {
                padding: 0 16px;
            }

            .content {
                padding: 18px 14px;
            }

            .toolbar {
                align-items: stretch;
                flex-direction: column;
            }

            .toolbar-left {
                width: 100%;
                justify-content: stretch;
                flex-direction: column;
            }

            .search-box {
                width: 100%;
            }

            .filter-select {
                width: 100%;
            }

            .admin-info {
                display: none;
            }
        }

        @media (max-width: 500px) {

            .stats {
                grid-template-columns: 1fr 1fr;

                gap: 9px;
            }

            .stat-card {
                padding: 14px;
            }

            .stat-card h3 {
                font-size: 18px;
            }

            .stat-card p {
                font-size: 10px;
            }

            .page-title h1 {
                font-size: 17px;
            }

            .page-title p {
                font-size: 10px;
            }

            .pagination {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>

<body>
